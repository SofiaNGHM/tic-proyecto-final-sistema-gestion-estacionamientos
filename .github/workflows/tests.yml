name: IoT simulator tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r sensor-hc-sr04-simulado/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s . -p "test_*.py"
